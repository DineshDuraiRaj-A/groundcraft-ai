<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(500,500)">

    <circle r="290" fill="none" stroke="url(#markGrad)" stroke-width="68"
            stroke-linecap="round"
            stroke-dasharray="1490 420"
            stroke-dashoffset="160"
            transform="rotate(90)"
            filter="url(#glow)"/>

    <rect x="20" y="-36" width="256" height="72" rx="36" fill="url(#markGrad)"/>
    <rect x="208" y="-36" width="72" height="190" rx="36" fill="url(#markGrad)"/>

    <!-- neural network nodes nested inside the ring -->
    <g stroke="#8FD9FF" stroke-width="4.5" opacity="0.9">
      <line x1="-104" y1="-60" x2="-15" y2="-112"/>
      <line x1="-104" y1="-60" x2="-15" y2="0"/>
      <line x1="-104" y1="60" x2="-15" y2="0"/>
      <line x1="-104" y1="60" x2="-15" y2="112"/>
      <line x1="-15" y1="-112" x2="82" y2="-45"/>
      <line x1="-15" y1="0" x2="82" y2="-45"/>
      <line x1="-15" y1="0" x2="82" y2="45"/>
      <line x1="-15" y1="112" x2="82" y2="45"/>
    </g>
    <g fill="#E0F7FF">
      <circle cx="-104" cy="-60" r="10"/>
      <circle cx="-104" cy="60" r="10"/>
      <circle cx="-15" cy="-112" r="10"/>
      <circle cx="-15" cy="0" r="12"/>
      <circle cx="-15" cy="112" r="10"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="82" cy="-45" r="12"/>
      <circle cx="82" cy="45" r="12"/>
    </g>

    <!-- circuit trace accents outside the ring -->
    <circle cx="0" cy="-290" r="20" fill="#22D3EE"/>
    <path d="M 0,-290 L 0,-354" stroke="#22D3EE" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-205" cy="-205" r="14" fill="#67E8F9"/>
    <path d="M -205,-205 L -253,-253" stroke="#67E8F9" stroke-width="11" stroke-linecap="round"/>
    <circle cx="262" cy="167" r="14" fill="#A78BFA"/>
  </g>
</svg>
